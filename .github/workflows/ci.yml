# Thoth · Developed by Shayan Azmi
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: pip install -r backend/requirements-dev.txt
      - name: Scenario tests (offline)
        run: python -m pytest
      - name: Frontend syntax
        run: for f in frontend/js/*.js frontend/scripted/*.js; do node --check "$f"; done
      - name: The app boots and serves the UI
        run: |
          python -m uvicorn backend.main:app --port 8000 &
          sleep 5
          python server/health_check.py --url http://localhost:8000
          curl -fsS http://localhost:8000/ | grep -q "/js/main.js"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -f server/Dockerfile -t thoth .
