# Thoth · Developed by Shayan Azmi
# Run from the repository root: docker compose -f server/docker-compose.yml up --build
services:
  thoth:
    build:
      context: ..
      dockerfile: server/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    volumes:
      - thoth-data:/data
    restart: unless-stopped

volumes:
  thoth-data:
